# Engine-independent checks only. Unreal Editor/packaged runtime tests, real
# Boxer input and other-PC checks still run locally (see docs/verification.md);
# a green run here is not evidence for them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Upstream APF commit verified in README "실제 SDACS 연동".
  SDACS_COMMIT: 1e9d826265069696d7e415c7778d17483d7a8580

jobs:
  cpp-unit:
    name: C++ ${{ matrix.suite }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        suite:
          - rules
          - radio
          - physics
          - guidance
          - manual-throttle
          - pilot-response
          - ai-training
          - ai-attacker
          - ai-recovery
    steps:
      - uses: actions/checkout@v4
      - name: Build and run Tests/run-${{ matrix.suite }}-tests.ps1
        shell: powershell
        run: .\Tests\run-${{ matrix.suite }}-tests.ps1

  python-unit:
    name: Python tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bridge dependencies
        run: python -m pip install -r Bridge/requirements.txt
      - name: Cage asset tests
        run: python Tests/test-cage-geometry.py
      - name: Flight session analyzer tests
        run: python Tests/test-flight-session.py
      - name: Clone pinned SDACS upstream
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/sun475300-sudo/swarm-drone-atc.git "$RUNNER_TEMP/swarm-drone-atc"
          git -C "$RUNNER_TEMP/swarm-drone-atc" checkout --detach "$SDACS_COMMIT"
      - name: SDACS bridge tests
        env:
          SDACS_REPO: ${{ runner.temp }}/swarm-drone-atc
        run: python Bridge/test_sdacs_bridge.py

  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject personal calibration, local settings and build output
        run: |
          bad=$(git ls-files | grep -E '(^|/)(Saved|Binaries|Intermediate|DerivedDataCache|dist|\.venv)/|(^|/)(RadioProfile|PilotControls)\.json$|SimulatorEnvironment\.local\.json$|\.(exe|dll|pdb|zip)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::These files must stay local (AGENTS.md):"
            echo "$bad"
            exit 1
          fi
      - name: Reject files over 20 MB
        run: |
          big=$(git ls-files -z | xargs -0 stat -c '%s %n' | awk '$1 > 20000000')
          if [ -n "$big" ]; then
            echo "::error::Files over 20 MB:"
            echo "$big"
            exit 1
          fi
