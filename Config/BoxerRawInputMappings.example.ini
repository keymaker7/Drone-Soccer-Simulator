; EXAMPLE ONLY - do not copy these mappings until the real Boxer axes are identified.
; Enable Unreal's Windows RawInput plugin, register the device VID/PID,
; inspect each physical axis, and map the correct Generic USB Axis numbers.
; The sample numbers below are NOT verified RadioMaster Boxer channel positions.
[/Script/Engine.InputSettings]
+AxisMappings=(AxisName="BoxerRoll",Scale=1.000000,Key=GenericUSBController_Axis1)
+AxisMappings=(AxisName="BoxerPitch",Scale=1.000000,Key=GenericUSBController_Axis2)
+AxisMappings=(AxisName="BoxerYaw",Scale=1.000000,Key=GenericUSBController_Axis3)
+AxisMappings=(AxisName="BoxerThrottle",Scale=1.000000,Key=GenericUSBController_Axis4)
